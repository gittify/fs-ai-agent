<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Weekly Recall Check Agent: architecture</title>
  <desc>EventBridge Scheduler triggers a Lambda that reads inventory from S3, uses Bedrock tool use to search the openFDA API, applies deterministic matching and guardrails in code, writes a workbook and audit trail to S3, tracks state in DynamoDB, and sends email through SES. CloudWatch and SNS alert on errors.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">Weekly Recall Check Agent</text>
  <text x="30" y="60" font-size="13" fill="#475569">The model proposes. Code decides. Every outcome is recorded, including "could not check".</text>

  <!-- Scheduler -->
  <rect x="30" y="110" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">EventBridge Scheduler</text>
  <text x="115" y="158" text-anchor="middle" font-size="12" fill="#475569">Mondays 06:00</text>
  <line x1="200" y1="142" x2="262" y2="142" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Lambda container -->
  <rect x="262" y="90" width="430" height="396" rx="12" fill="#f0fdfa" stroke="#01696f" stroke-width="2"/>
  <text x="280" y="114" font-size="15" font-weight="700" fill="#01696f">AWS Lambda (Python 3.12): recall_agent</text>

  <rect x="282" y="132" width="390" height="62" rx="8" fill="#ffffff" stroke="#01696f"/>
  <text x="477" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1. Read and validate inventory</text>
  <text x="477" y="177" text-anchor="middle" font-size="12" fill="#475569">per-lot SKU, UPC, quantities; bad file fails loudly</text>

  <rect x="282" y="214" width="390" height="62" rx="8" fill="#ffffff" stroke="#01696f"/>
  <text x="477" y="239" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2. Agent loop per item (tool use)</text>
  <text x="477" y="259" text-anchor="middle" font-size="12" fill="#475569">model searches openFDA, retries with backoff, proposes a decision</text>

  <rect x="282" y="296" width="390" height="76" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="477" y="321" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3. Code decides: matcher + guardrails</text>
  <text x="477" y="341" text-anchor="middle" font-size="12" fill="#475569">any error: NOT CHECKED. HOLD only on firm/UPC + lot match.</text>
  <text x="477" y="359" text-anchor="middle" font-size="12" fill="#475569">disagreement with the model: NEEDS REVIEW</text>

  <rect x="282" y="392" width="390" height="76" rx="8" fill="#ffffff" stroke="#01696f"/>
  <text x="477" y="417" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">4. Hand it off</text>
  <text x="477" y="437" text-anchor="middle" font-size="12" fill="#475569">fill the coordinator's own workbook + audit sheet,</text>
  <text x="477" y="455" text-anchor="middle" font-size="12" fill="#475569">send hold notices, send the weekly summary</text>

  <line x1="477" y1="194" x2="477" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="477" y1="276" x2="477" y2="296" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="477" y1="372" x2="477" y2="392" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Left: S3 + DynamoDB -->
  <rect x="30" y="236" width="170" height="74" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Amazon S3</text>
  <text x="115" y="282" text-anchor="middle" font-size="12" fill="#475569">inventory/ in</text>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#475569">records/ out (xlsx, md, json)</text>
  <line x1="200" y1="262" x2="282" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="282" y1="440" x2="200" y2="296" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="30" y="350" width="170" height="74" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Amazon DynamoDB</text>
  <text x="115" y="396" text-anchor="middle" font-size="12" fill="#475569">resume a rerun;</text>
  <text x="115" y="412" text-anchor="middle" font-size="12" fill="#475569">one hold notice per recall</text>
  <line x1="200" y1="386" x2="282" y2="334" stroke="#475569" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Right: external services -->
  <rect x="740" y="110" width="210" height="76" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="845" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">openFDA API</text>
  <text x="845" y="155" text-anchor="middle" font-size="12" fill="#475569">public food enforcement data</text>
  <text x="845" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">tool we did not build</text>
  <line x1="672" y1="236" x2="740" y2="160" stroke="#475569" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="740" y="214" width="210" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="845" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Amazon Bedrock</text>
  <text x="845" y="259" text-anchor="middle" font-size="12" fill="#475569">Converse API with tool use</text>
  <text x="845" y="276" text-anchor="middle" font-size="12" fill="#475569">Haiku 4.5 (US) + Guardrails filter</text>
  <line x1="672" y1="250" x2="740" y2="250" stroke="#475569" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="740" y="338" width="210" height="64" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="845" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Amazon SES</text>
  <text x="845" y="383" text-anchor="middle" font-size="12" fill="#475569">hold notices + weekly summary</text>
  <line x1="672" y1="430" x2="740" y2="380" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="740" y="446" width="210" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="845" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Inboxes</text>
  <text x="845" y="491" text-anchor="middle" font-size="12" fill="#475569">purchasing contact, coordinator</text>
  <line x1="845" y1="402" x2="845" y2="446" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Alarm path -->
  <rect x="262" y="520" width="430" height="64" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="477" y="546" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">CloudWatch dashboard + alarms → SNS → coordinator email</text>
  <text x="477" y="566" text-anchor="middle" font-size="12" fill="#475569">metrics every run; no Monday summary email means it did not run</text>
  <line x1="477" y1="486" x2="477" y2="520" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Human -->
  <rect x="740" y="540" width="210" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="845" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Human: weekly signoff</text>
  <text x="845" y="585" text-anchor="middle" font-size="12" fill="#475569">the agent never signs as a person</text>
  <line x1="845" y1="510" x2="845" y2="540" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- Legend -->
  <rect x="30" y="470" width="14" height="14" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="52" y="482" font-size="12" fill="#475569">where failures are handled in code</text>
  <rect x="30" y="494" width="14" height="14" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="52" y="506" font-size="12" fill="#475569">external tool (not built by us)</text>

</svg>
